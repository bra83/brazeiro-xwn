name: Repair legacy control characters

on:
  push:
    branches: [xwn-4.0.0-barbara]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xwn-4.0.0-barbara
      - name: Replace literal backspace bytes in legacy engine regexes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('engine.js')
          s=p.read_text('utf-8')
          n=s.count('\x08')
          if n:
              p.write_text(s.replace('\x08', r'\b'),'utf-8')
          print('replaced',n,'literal backspace characters')
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore word-boundary regexes from XWN 3.7 hardening [skip ci]'
          git push origin HEAD:xwn-4.0.0-barbara
