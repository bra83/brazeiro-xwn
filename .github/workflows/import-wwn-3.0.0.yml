name: Import WWN 3.0.0

on:
  push:
    branches:
      - agent/import-wwn-3.0.0
    paths:
      - '.github/workflows/import-wwn-3.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-wwn-3.0.0
          fetch-depth: 0
      - name: Download exact release ZIP
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/wwn3.zip 'https://drive.usercontent.google.com/download?id=1R5H8kDU1QD3cBpfXUi-Yg_lxYE5hfb87&export=download&confirm=t'
          echo '34c00540d0c2f0a34e3ee5503a4484d7f39a9dc0eaca48ad68b085c4a15896a6  /tmp/wwn3.zip' | sha256sum -c -
      - name: Extract project
        run: |
          set -euo pipefail
          rm -rf /tmp/wwn3-import
          mkdir -p /tmp/wwn3-import
          unzip -q /tmp/wwn3.zip -d /tmp/wwn3-import
          SRC=$(find /tmp/wwn3-import -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$SRC"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. ./
      - name: Validate expected files
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f engine.js
          test -f rules-index.js
          test -f audioEngineV2.js
          test -f gmBridge.js
          test -f tests/test_engine.js
          test -f VALIDACAO_V3.txt
          test -d assets/hex_full
          test "$(find assets/hex_full -type f -name '*.png' | wc -l)" -ge 30
          node tests/test_engine.js
      - name: Commit imported build
        run: |
          set -euo pipefail
          git config user.name 'Braseiro XWN Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import WWN 3.0.0 Mesa Viva' || exit 0
          git push origin HEAD:agent/import-wwn-3.0.0
