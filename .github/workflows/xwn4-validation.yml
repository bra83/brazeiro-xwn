name: XWN 4 Barbara validation

on:
  push:
    branches: [xwn-4.0.0-barbara]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in engine.js systems.js adapters.js swn-rules-index.js xwn4-runtime.js xwn4-rules-fix.js xwn4-compat.js xwn4-mechanics-fix.js xwn4-migration.js xwn4-combat-bridge.js barbara-browser.js audioEngineV2.js local-audio-library.js snapshot-store.js gmBridge.js app.js xwn4-ui.js; do node --check "$f"; done
      - name: Preserved engine regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_engine.js | tee /tmp/legacy.log
      - name: XWN 3.7 quick-rule regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_xwn4_rule_boundaries.js | tee /tmp/rulefix.log
      - name: XWN 4 rules security tactical Barbara fuzz
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_xwn4_runtime.js | tee /tmp/xwn4.log
      - name: Static parity audit
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_xwn4_static.py | tee /tmp/static.log
      - name: Install Chromium test harness
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Real browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/browser-smoke.mjs | tee /tmp/browser.log
          for p in index.html systems.js adapters.js xwn4-runtime.js xwn4-rules-fix.js barbara-browser.js manifest.webmanifest; do curl -fsS "http://127.0.0.1:8765/$p" >/dev/null; done
      - name: Build validation report
        run: |
          set -euo pipefail
          {
            echo 'BRASEIRO XWN 4.0.0 — MOTOR BARBARA'
            echo "Commit: $GITHUB_SHA"
            echo "Actions run: $GITHUB_RUN_ID"
            echo
            cat /tmp/legacy.log
            cat /tmp/rulefix.log
            cat /tmp/xwn4.log
            cat /tmp/static.log
            cat /tmp/browser.log
            echo
            echo 'WWN: RULES READY — WWN SRD 1.0'
            echo 'SWN: RULES READY — Stars Without Number Revised'
            echo 'CWN: FAIL-CLOSED — corpus RULE principal não empacotado'
            echo 'AWN: FAIL-CLOSED — corpus RULE principal não empacotado'
            echo 'Barbara: 1.0.0 @ a31fdb9f9e361fc81b6a5f25c7646450311d0ce3'
          } > VALIDACAO_XWN_4.0.0.txt
      - name: Package release candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/xwnpkg && mkdir -p /tmp/xwnpkg/Braseiro_XWN_4.0.0_MOTOR_BARBARA
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude 'package.json' --exclude 'package-lock.json' --exclude 'releases' ./ /tmp/xwnpkg/Braseiro_XWN_4.0.0_MOTOR_BARBARA/
          cp VALIDACAO_XWN_4.0.0.txt /tmp/xwnpkg/Braseiro_XWN_4.0.0_MOTOR_BARBARA/
          cd /tmp/xwnpkg
          zip -qr "$GITHUB_WORKSPACE/Braseiro_XWN_4.0.0_MOTOR_BARBARA.zip" Braseiro_XWN_4.0.0_MOTOR_BARBARA
          cd "$GITHUB_WORKSPACE"
          sha256sum Braseiro_XWN_4.0.0_MOTOR_BARBARA.zip > Braseiro_XWN_4.0.0_MOTOR_BARBARA.sha256
          unzip -t Braseiro_XWN_4.0.0_MOTOR_BARBARA.zip >/tmp/ziptest.log
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: Braseiro-XWN-4.0.0-Motor-Barbara
          path: |
            Braseiro_XWN_4.0.0_MOTOR_BARBARA.zip
            Braseiro_XWN_4.0.0_MOTOR_BARBARA.sha256
            VALIDACAO_XWN_4.0.0.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish green gate metadata
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git ls-remote origin refs/heads/xwn-4.0.0-barbara | cut -f1)"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Run superseded by $HEAD_SHA; skip green metadata."
            exit 0
          fi
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/run_id.txt
          printf '%s\n' "$GITHUB_SHA" > /tmp/source_commit.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan xwn4-export-work
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p exported
          cp /tmp/run_id.txt exported/run_id.txt
          cp /tmp/source_commit.txt exported/source_commit.txt
          cp VALIDACAO_XWN_4.0.0.txt exported/
          cp Braseiro_XWN_4.0.0_MOTOR_BARBARA.sha256 exported/
          git add exported
          git commit -m 'export: XWN 4 green validation gate [skip ci]'
          git push --force origin HEAD:xwn4-export
      - name: Publish latest run metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git ls-remote origin refs/heads/xwn-4.0.0-barbara | cut -f1)"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Run superseded by $HEAD_SHA; skip latest metadata."
            exit 0
          fi
          rm -rf /tmp/xwn4-meta
          git worktree add --detach /tmp/xwn4-meta "$GITHUB_SHA"
          cd /tmp/xwn4-meta
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan xwn4-latest-work
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p exported
          printf '%s\n' "$GITHUB_RUN_ID" > exported/run_id.txt
          printf '%s\n' "$GITHUB_SHA" > exported/source_commit.txt
          printf '%s\n' "$JOB_STATUS" > exported/status.txt
          git add exported
          git commit -m 'ci: XWN 4 latest run metadata [skip ci]'
          git push --force origin HEAD:xwn4-latest
