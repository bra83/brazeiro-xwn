name: Import WWN 3.0.1

on:
  push:
    branches:
      - agent/import-wwn-3.0.1
    paths:
      - '.github/workflows/import-wwn-3.0.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-wwn-3.0.1
          fetch-depth: 0
      - name: Download exact release ZIP
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/wwn301.zip 'https://drive.usercontent.google.com/download?id=1783IzTlAXme89g78LG7c6JJIwWnJc9Oi&export=download&confirm=t'
          echo '9a31f496242ae99ff1155d57ef1b5b94018ddbb6c0ed3b790c8de6d1766acdae  /tmp/wwn301.zip' | sha256sum -c -
      - name: Extract project
        run: |
          set -euo pipefail
          rm -rf /tmp/wwn301-import
          mkdir -p /tmp/wwn301-import
          unzip -q /tmp/wwn301.zip -d /tmp/wwn301-import
          SRC=$(find /tmp/wwn301-import -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$SRC"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. ./
      - name: Validate 3.0.1
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f engine.js
          test -f gmBridge.js
          test -f rules-index.js
          test -f audioEngineV2.js
          test -f tests/test_engine.js
          test -f PATCH_3.0.1_MESA.md
          test -d assets/hex_full
          test "$(find assets/hex_full -type f -name '*.png' | wc -l)" -ge 30
          node tests/test_engine.js
          node --check engine.js
          node --check app.js
          node --check gmBridge.js
      - name: Commit imported build
        run: |
          set -euo pipefail
          git config user.name 'Braseiro XWN Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'WWN 3.0.1 mesa viva' || exit 0
          git push origin HEAD:agent/import-wwn-3.0.1
