name: Patch restored WWN hex library renderer

on:
  push:
    branches: [xwn-4.0.0-barbara]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xwn-4.0.0-barbara
      - name: Use manifest file path instead of assuming PNG extension
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text('utf-8')
          old="img.src=`assets/hex_full/${id}.png`;img.alt=x.variant;"
          new="img.src=x.file||`assets/hex_full/${id}.png`;img.alt=x.variant;"
          if old not in s:
              print('renderer already patched or source changed')
          else:
              p.write_text(s.replace(old,new,1),'utf-8')
              print('renderer patched')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: render restored WWN variants from manifest file paths [skip ci]'
          git push origin HEAD:xwn-4.0.0-barbara
