name: Promote XWN 3.4.0

on:
  push:
    branches: [main]
    paths:
      - 'releases/xwn-3.4.0-promotion.tar.gz'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote runtime firewall checkpoint
        run: tar -xzf releases/xwn-3.4.0-promotion.tar.gz -C .
      - name: Validate JavaScript
        run: |
          for f in systems.js adapters.js engine.js app.js audioEngineV2.js gmBridge.js rules-index.js hex-library.js sw.js; do node --check "$f"; done
      - name: Run engine hardening suite
        run: node tests/test_engine.js
      - name: Verify HTML local references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          refs=[m.group(1) for m in re.finditer(r'''(?:src|href)=["']([^"'#?]+)''',h)]
          refs=[x for x in refs if not x.startswith(('http:','https:','data:','mailto:'))]
          missing=[x for x in refs if not Path(x).exists()]
          assert not missing, missing
          PY
      - name: Commit promoted tree
        run: |
          git config user.name 'Braseiro XWN Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add engine.js adapters.js app.js sw.js manifest.webmanifest index.html tests/test_engine.js README.md CHANGELOG_3.4.0_RUNTIME_FIREWALL.md VALIDACAO_3.4.0.txt HARDENING_STATUS_3.4.0.json
          if git diff --cached --quiet; then
            echo 'Tree already promoted.'
            exit 0
          fi
          git commit -m 'XWN 3.4.0 runtime firewall hardening'
          git push origin HEAD:main
